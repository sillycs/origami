<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Origami Battles</title>
	<meta name="description" content="Fight with doodles with many characters">

	<link rel="icon" type="image/png" href="/origami.png">
	<link rel="apple-touch-icon" href="/origami.png">

	<meta property="og:type" content="website">
	<meta property="og:title" content="Origami Battles">
	<meta property="og:description" content="Fight with doodles with many characters">
	<meta property="og:image" content="https://origamis.wtf/origami.png">
	<meta property="og:url" content="https://origamis.wtf/">
	<meta property="og:site_name" content="Origami Battles">

	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Origami Battles">
	<meta name="twitter:description" content="Fight with doodles with many characters">
	<meta name="twitter:image" content="https://origamis.wtf/origami.png">

	<meta name="theme-color" content="#ffffff">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">

	<style>
		html, body {
			margin: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		body {
			position: relative;
			display: flex;
			justify-content: center;
			align-items: center;

			background-image: url('/back.png');
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			background-attachment: fixed;
		}

		body::before {
			content: "";
			position: absolute;
			inset: 0;

			background: rgba(0, 0, 0, 0.45);

			pointer-events: none;
			z-index: 0;
		}

		.container {
			position: relative;
			z-index: 1;

			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;

			width: 100%;
			height: 100%;
		}

		.logo {
			display: block;

			width: 420px;
			max-width: 75vw;
			height: auto;

			margin-bottom: 18px;
		}

		iframe {
			width: 500px;
			height: 800px;

			max-width: 100vw;
			max-height: 75vh;

			border: 0;
			border-radius: 24px;

			display: block;
			overflow: hidden;
		}

		.credits {
			margin-top: 18px;

			color: white;
			font-family: "Schoolbell", cursive;
			font-size: 20px;
			line-height: 1.25;

			text-align: center;

			text-shadow:
				2px 2px 0 rgba(0, 0, 0, 0.45);
		}

		.credits div {
			margin: 2px 0;
		}

		@media (max-height: 900px) {
			.logo {
				width: 320px;
				margin-bottom: 10px;
			}

			iframe {
				max-height: 68vh;
			}

			.credits {
				margin-top: 10px;
				font-size: 17px;
			}
		}

		@media (max-width: 600px) {
			.logo {
				width: 300px;
				max-width: 70vw;
			}

			iframe {
				width: 100vw;
				max-width: 100vw;
				border-radius: 18px;
			}

			.credits {
				font-size: 16px;
			}
		}
	</style>
</head>

<body>
	<div class="container">

		<img
			class="logo"
			src="/OB.png"
			alt="Origami Battles"
		>

		<iframe
			src="game/index.html"
			allow="autoplay; fullscreen"
			allowfullscreen>
		</iframe>

		<div class="credits">
			<div>Programmed by @SillyCS</div>
			<div>Created by @OrigamiBattles</div>
		</div>

	</div>
</body>
</html>
