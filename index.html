<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Origami Battles</title>
	<meta name="description" content="Fight with doodles with many characters">
	<link rel="icon" type="image/png" href="/origami.png">
	<link rel="apple-touch-icon" href="/origami.png">
	<meta property="og:type" content="website">
	<meta property="og:title" content="Origami Battles">
	<meta property="og:description" content="Fight with doodles with many characters">
	<meta property="og:image" content="https://origamis.wtf/origami.png">
	<meta property="og:url" content="https://origamis.wtf/">
	<meta property="og:site_name" content="Origami Battles">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Origami Battles">
	<meta name="twitter:description" content="Fight with doodles with many characters">
	<meta name="twitter:image" content="https://origamis.wtf/origami.png">
	<meta name="theme-color" content="#ffffff">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
	<style>
		html, body {
			margin: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}
		body {
			position: relative;
			display: flex;
			justify-content: center;
			align-items: center;
			background-image: url('/back.png');
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			background-attachment: fixed;
		}
		body::before {
			content: "";
			position: absolute;
			inset: 0;
			background: rgba(0, 0, 0, 0.45);
			pointer-events: none;
			z-index: 0;
		}
		.container {
			position: relative;
			z-index: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			width: 100%;
			height: 100%;
		}
		.logo {
			display: block;
			width: 420px;
			max-width: 75vw;
			height: auto;
			margin-bottom: 18px;
		}
		iframe {
			width: 500px;
			height: 800px;
			max-width: 100vw;
			max-height: 70vh;
			border: 0;
			border-radius: 24px;
			display: block;
			overflow: hidden;
		}
		.actions {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 14px;
			margin-top: 16px;
		}
		.sketch-btn {
			font-family: "Schoolbell", cursive;
			font-size: 21px;
			line-height: 1;
			color: #000;
			background: #fff;
			border: 3px solid #000;
			border-radius: 14px 5px 16px 6px / 6px 16px 5px 14px;
			padding: 12px 24px;
			text-decoration: none;
			white-space: nowrap;
			box-shadow: 4px 4px 0 #000;
			transform: rotate(-1.5deg);
			transition: transform .12s ease, box-shadow .12s ease;
			cursor: pointer;
		}
		.actions .sketch-btn:nth-child(even) {
			transform: rotate(1.5deg);
			border-radius: 6px 16px 5px 14px / 14px 5px 16px 6px;
		}
		.sketch-btn.primary {
			background: #ffe14d;
		}
		.sketch-btn:hover,
		.sketch-btn:focus-visible {
			transform: rotate(0deg) translate(-1px, -2px);
			box-shadow: 6px 7px 0 #000;
			outline: none;
		}
		.sketch-btn:focus-visible {
			box-shadow: 6px 7px 0 #000, 0 0 0 3px #fff;
		}
		.sketch-btn:active {
			transform: rotate(0deg) translate(3px, 3px);
			box-shadow: 1px 1px 0 #000;
		}
		@media (prefers-reduced-motion: reduce) {
			.sketch-btn { transition: none; }
		}
		.credits {
			margin-top: 16px;
			color: white;
			font-family: "Schoolbell", cursive;
			font-size: 20px;
			line-height: 1.25;
			text-align: center;
			text-shadow:
				2px 2px 0 rgba(0, 0, 0, 0.45);
		}
		.credits div {
			margin: 2px 0;
		}
		@media (max-height: 900px) {
			.logo {
				width: 320px;
				margin-bottom: 10px;
			}
			iframe {
				max-height: 56vh;
			}
			.actions {
				margin-top: 12px;
				gap: 10px;
			}
			.sketch-btn {
				font-size: 18px;
				padding: 9px 18px;
			}
			.credits {
				margin-top: 10px;
				font-size: 17px;
			}
		}
		@media (max-width: 600px) {
			.logo {
				width: 300px;
				max-width: 70vw;
			}
			iframe {
				width: 100vw;
				max-width: 100vw;
				border-radius: 18px;
			}
			.sketch-btn {
				font-size: 17px;
				padding: 9px 14px;
			}
			.credits {
				font-size: 16px;
			}
		}
	</style>
</head>
<body>
	<div class="container">
		<img
			class="logo"
			src="/OB_new.png"
			alt="Origami Battles"
		>
		<iframe
			src="assets/index.html"
			allow="autoplay; fullscreen"
			allowfullscreen>
		</iframe>
		<div class="actions">
			<a class="sketch-btn primary" href="/download.html">Download</a>
			<a class="sketch-btn" href="/doodle.html">Make your doodle</a>
			<a class="sketch-btn" href="/changelogs.html">Changelogs</a>
		</div>
		<div class="credits">
			<div>Programmed by @SillyCS</div>
			<div>Created by @OrigamiBattles</div>
			<div>This is NOT official</div>
		</div>
	</div>
</body>
</html>
