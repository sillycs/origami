<script>
(function () {
	"use strict";

	const cCanvas = document.getElementById('confetti');
	const cx = cCanvas.getContext('2d');
	let bits = [], raf = null;

	function fitConfetti() {
		const dpr = window.devicePixelRatio || 1;
		cCanvas.width = window.innerWidth * dpr;
		cCanvas.height = window.innerHeight * dpr;
		cx.setTransform(dpr, 0, 0, dpr, 0, 0);
	}
	fitConfetti();
	window.addEventListener('resize', fitConfetti);

	const CONFETTI_COLORS = ['#e23b3b', '#f2820b', '#ffd21e', '#3fae4a', '#2f8fdd', '#7b4fd1', '#f06fae', '#ffffff'];

	function burst(x, y) {
		for (let i = 0; i < 110; i++) {
			const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.0;
			const sp = 7 + Math.random() * 13;
			bits.push({
				x: x, y: y,
				vx: Math.cos(a) * sp + (Math.random() - 0.5) * 3,
				vy: Math.sin(a) * sp,
				w: 7 + Math.random() * 9,
				h: 5 + Math.random() * 8,
				rot: Math.random() * Math.PI,
				vr: (Math.random() - 0.5) * 0.4,
				color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],
				life: 1
			});
		}
		if (!raf) raf = requestAnimationFrame(step);
	}

	function step() {
		cx.clearRect(0, 0, cCanvas.width, cCanvas.height);
		const floor = window.innerHeight + 60;
		bits = bits.filter(b => b.life > 0 && b.y < floor);
		for (const b of bits) {
			b.vy += 0.32;
			b.vx *= 0.99;
			b.vy *= 0.99;
			b.x += b.vx;
			b.y += b.vy;
			b.rot += b.vr;
			b.life -= 0.004;
			cx.save();
			cx.translate(b.x, b.y);
			cx.rotate(b.rot);
			cx.globalAlpha = Math.max(0, Math.min(1, b.life));
			cx.fillStyle = b.color;
			cx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.rot)));
			cx.strokeStyle = 'rgba(0,0,0,.75)';
			cx.lineWidth = 1;
			cx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.rot)));
			cx.restore();
		}
		if (bits.length) { raf = requestAnimationFrame(step); }
		else { cx.clearRect(0, 0, cCanvas.width, cCanvas.height); raf = null; }
	}

	function cheer(x, y, text) {
		const el = document.createElement('div');
		el.className = 'cheer';
		el.textContent = text;
		el.style.left = x + 'px';
		el.style.top = y + 'px';
		document.body.appendChild(el);
		setTimeout(() => el.remove(), 1600);
	}

	document.querySelectorAll('.card').forEach(card => {
		card.addEventListener('click', () => {
			const r = card.getBoundingClientRect();
			burst(r.left + r.width / 2, r.top + r.height / 2);
			cheer(r.left + r.width / 2, r.top + 10, card.dataset.cheer || 'Amazing!');
		});
	});
})();
</script>
</body>
</html>
